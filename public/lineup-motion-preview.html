<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首发逐线动效示意</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff3fa;color:#18202d;font:15px/1.6 'Microsoft YaHei',sans-serif}main{max-width:1500px;margin:auto;padding:22px}h1{margin:0;font-size:24px}p{color:#526079;margin:8px 0 16px}.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:15px 0}button,select{font:inherit;border:1px solid #adc1e4;padding:8px 14px;background:white;color:#18202d;border-radius:6px}button{cursor:pointer;background:#1355fc;color:white;border-color:#1355fc}.screen{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;background:#081329;box-shadow:0 8px 30px #14366722;border-radius:8px}iframe{width:1920px;height:1080px;border:0;transform-origin:top left}.note{font-size:13px}label{display:flex;gap:8px;align-items:center}</style></head><body><main><h1>首发逐线动效 · 示意</h1><p>球员卡从左到右依次淡入、由小放大，停稳后完整显示。底部位置条同步展开。</p><div class="controls"><label>球员分线<select id="group"><option value="goalkeeper">门将</option><option value="defenders" selected>后卫线</option><option value="midfielders">中场线</option><option value="forwards">前锋线</option></select></label><label>转播主题<select id="theme"><option value="pulse">PULSE</option><option value="nocturne">NOCTURNE</option></select></label><button id="replay">重播动画</button><button id="close">窗帘式收起</button><label><input id="loop" type="checkbox" checked>循环示意</label><strong id="state">等待画面载入…</strong><span id="team"></span></div><div class="screen"><iframe id="screen" title="逐线球员入场动画示意"></iframe></div><p class="note">此页只读当前赛前阵容，不修改资料或实播。这套动效已确认用于正式首发逐线展示。</p></main><script type="module">
const frame=document.querySelector('#screen'),group=document.querySelector('#group'),theme=document.querySelector('#theme');
let timers=[],scheduled=false;
const state=document.querySelector('#state'),loop=document.querySelector('#loop');
function stop(){timers.forEach(clearTimeout);timers=[];}
function close(){stop();state.textContent='窗帘式收起';frame.contentWindow.postMessage({type:'lineDemoExit'},location.origin);timers.push(setTimeout(()=>state.textContent='已收起',750));}
function replay(){stop();scheduled=false;state.textContent='加载中…';frame.src=`overlay.html?scene=formation&step=media-${group.value}&theme=${theme.value}&lineMotion=1&revision=${Date.now()}`;}
addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||e.data?.type!=='previewState'||scheduled)return;scheduled=true;state.textContent='停顿 · 准备展开';timers.push(setTimeout(()=>state.textContent='从左到右 · 快速展开，尾端减速',330),setTimeout(()=>state.textContent='停稳展示',1800));if(loop.checked)timers.push(setTimeout(()=>{close();timers.push(setTimeout(replay,1400));},3600));});
document.querySelector('#replay').onclick=replay;document.querySelector('#close').onclick=()=>{loop.checked=false;close();};loop.onchange=replay;group.onchange=replay;theme.onchange=replay;
new ResizeObserver(()=>frame.style.transform=`scale(${frame.parentElement.clientWidth/1920})`).observe(frame.parentElement);
try{const {data}=await fetch('/api/preview').then(r=>r.json()),lineup=data.config.team==='away'?data.awayFormation:data.formation;document.querySelector('#team').textContent='当前阵容：'+data[data.config.team].name;for(const option of group.options){const count=lineup.players.filter(p=>p.group===option.value).length;option.textContent+=`（${count}人）`;option.disabled=count===0;}if(group.selectedOptions[0].disabled)group.value=[...group.options].find(o=>!o.disabled)?.value||'goalkeeper';}catch{document.querySelector('#team').textContent='当前服务未连接';}
replay();
</script></body></html>
