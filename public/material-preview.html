<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUST CUP · 渐变亚克力材质设计预览</title><link rel="stylesheet" href="material-preview.css"></head><body>
<header><div><small>HUST CUP / MATERIAL STUDY 01</small><h1>渐变亚克力 · 材质提案</h1><p>保留现有蓝色体系和版式，底色至少保留70%，以蓝色渐变、细边高光与柔和阴影调整质感。</p></div><a href="/">返回控制台 ↗</a></header>
<nav aria-label="材质预览设置"><label>视觉主题<select id="theme"><option value="pulse">PULSE 几何竞技</option><option value="nocturne">NOCTURNE 蓝夜杯赛</option></select></label><label>边角<select id="corners"><option value="round">圆角</option><option value="square">方角</option></select></label><label>画面<select id="scene"><option value="goal">进球 + 常驻比分</option><option value="bottomScore">底部比分 + 进球记录</option><option value="entrance">入场对阵条</option><option value="shootoutCompact">点球大战简版</option><option value="officials">裁判团队</option></select></label><label>预览尺度<select id="detail"><option value="full">完整画面</option><option value="detail">材质近看</option></select></label><label>底图透出 <output id="transparency-value">25%</output><input id="transparency" type="range" min="0" max="30" value="25" aria-label="底图透出比例，最高30%"></label><button id="replay">重播展开动画</button></nav>
<main><section><div class="caption"><b>01 / 当前实色材质</b><span>清晰、紧凑、高对比</span></div><div class="window"><iframe id="solid" title="当前实色材质预览"></iframe></div></section><section><div class="caption"><b>02 / 渐变亚克力提案</b><span>轻微透底、蓝色渐变、细边高光</span></div><div class="window"><iframe id="glass" title="渐变亚克力材质独立预览"></iframe></div></section></main>
<footer><strong>仅设计预览，不改比赛、不改实播。</strong><p>两张画面使用相同草稿资料。右侧背景最多透出30%底图（底色至少70%不透明）；文字和标志保持清晰。材质由渐变、高光和阴影呈现，无需模糊滤镜。新材质尚未设为正式主题。</p></footer><script type="module" src="material-preview.js"></script></body></html>
